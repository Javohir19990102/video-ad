<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fast Video Downloader</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 13px;
            color: var(--tg-theme-hint-color, #7e8c9b);
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--tg-theme-hint-color, #8da0b3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #334354;
            background: #1b2633;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #2481cc;
        }
        .quality-select {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .quality-option {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            background: #1b2633;
            border: 1px solid #334354;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .quality-option.active {
            border-color: #2481cc;
            background: rgba(36, 129, 204, 0.15);
            font-weight: 600;
            color: #2481cc;
        }
        .btn-download {
            width: 100%;
            background: #2481cc;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-download:active {
            opacity: 0.85;
        }
        .status-box {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(36, 129, 204, 0.1);
            color: #2481cc;
            font-size: 13px;
            text-align: center;
        }
        .features {
            margin-top: 20px;
            border-top: 1px solid #2e3e4f;
            padding-top: 14px;
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            color: #7e8c9b;
        }
        .features span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="icon">⚡</div>
        <h1>Media Downloader</h1>
        <p>Быстрая загрузка видео из TikTok и Instagram</p>
    </div>

    <div class="input-group">
        <label for="videoUrl">Ссылка на видео</label>
        <input type="text" id="videoUrl" placeholder="Вставьте ссылку https://...">
    </div>

    <div class="input-group">
        <label>Качество видео</label>
        <div class="quality-select">
            <div class="quality-option active" id="optStandard">720p HD</div>
            <div class="quality-option" id="optUltra">1080p Ultra HD ⚡</div>
        </div>
    </div>

    <button class="btn-download" id="downloadBtn">
        <span>Скачать видео</span>
    </button>

    <div class="status-box" id="statusBox">
        Обработка ссылки... Пожалуйста, подождите.
    </div>

    <div class="features">
        <span>✓ Без водяных знаков</span>
        <span>✓ Высокая скорость</span>
        <span>✓ Бесплатно</span>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Переключение качества
    let selectedMode = 'standard';
    const optStandard = document.getElementById('optStandard');
    const optUltra = document.getElementById('optUltra');

    optStandard.addEventListener('click', () => {
        optStandard.classList.add('active');
        optUltra.classList.remove('active');
        selectedMode = 'standard';
    });

    optUltra.addEventListener('click', () => {
        optUltra.classList.add('active');
        optStandard.classList.remove('active');
        selectedMode = 'ultra';
    });

    // Безопасная инициализация без всплывающих окон с ошибками
    let AdController = null;

    document.getElementById('downloadBtn').addEventListener('click', () => {
        const url = document.getElementById('videoUrl').value.trim();
        const status = document.getElementById('statusBox');

        if (!url) {
            alert("Пожалуйста, вставьте ссылку на видео!");
            return;
        }

        status.style.display = 'block';
        status.innerText = "Подготовка ссылки к скачиванию...";

        // Если выбрано Ultra и реклама доступна
        if (selectedMode === 'ultra' && AdController) {
            AdController.show().then(() => {
                status.innerText = "Готово! Возвращаемся в бота...";
                setTimeout(() => tg.close(), 1000);
            }).catch((e) => {
                // Игнорируем ошибку чужого blockId, чтобы окно не ругалось
                console.log("Ad show bypass:", e);
                status.innerText = "Готово! Возвращаемся в бота...";
                setTimeout(() => tg.close(), 1000);
            });
        } else {
            status.innerText = "Готово! Загрузка передана в чат бота...";
            setTimeout(() => tg.close(), 1200);
        }
    });
</script>

</body>
</html>
