<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реклама</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #111827;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 90vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
        }
        .title { font-size: 20px; margin-bottom: 8px; font-weight: bold; }
        .desc { font-size: 14px; color: #9ca3af; margin-bottom: 24px; }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            max-width: 280px;
        }
    </style>
</head>
<body>
    <div class="title">🎬 Видео готово к отправке!</div>
    <div class="desc">Посмотрите короткий ролик спонсора, чтобы получить файл.</div>
    <button class="btn" id="showAdBtn">▶️ Смотреть рекламу</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Вставьте сюда ваш Block ID из Adsgram вместо 12345:
        const AdController = window.Adsgram.init({ blockId: "48982" });

        document.getElementById('showAdBtn').addEventListener('click', () => {
            AdController.show().then((result) => {
                // Ролик досмотрен до конца:
                tg.sendData("ad_completed");
                tg.close();
            }).catch((err) => {
                alert("Пожалуйста, досмотрите видео до конца, чтобы забрать файл.");
            });
        });
    </script>
</body>
</html>
