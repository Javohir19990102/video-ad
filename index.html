<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Video Downloader</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #18222d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #212d3b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            max-width: 320px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #8da0b3;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .btn-hd {
            background: #2481cc;
            color: #ffffff;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-hd:active {
            background: #1b66a3;
        }
        .btn-standard {
            background: transparent;
            color: #8da0b3;
            border: 1px solid #364759;
            padding: 10px 16px;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        .btn-standard:active {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎬 Качество загрузки</h2>
        <p>Выберите режим: посмотрите короткий ролик спонсора для загрузки в максимальном HD качестве или продолжите в стандартном.</p>
        
        <button class="btn-hd" id="watchAdBtn">
            ⚡ Скачать в Ultra HD (ролик)
        </button>
        
        <button class="btn-standard" id="skipAdBtn">
            Обычное качество (без рекламы)
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Инициализация Adsgram (ID замените после активации платформы)
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "int-14408" }) : null;

        // Кнопка 1: HD качество через просмотр рекламы
        document.getElementById('watchAdBtn').addEventListener('click', () => {
            if (AdController) {
                AdController.show().then((result) => {
                    tg.close();
                }).catch((error) => {
                    // Если рекламы нет в регионе, просто закрываем
                    tg.close();
                });
            } else {
                tg.close();
            }
        });

        // Кнопка 2: Добровольный пропуск без рекламы (удовлетворяет правилу Adsgram)
        document.getElementById('skipAdBtn').addEventListener('click', () => {
            tg.close();
        });
    </script>
</body>
</html>
